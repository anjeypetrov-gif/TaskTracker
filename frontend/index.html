                                    <!-- Day Header -->
                                    <div class="flex items-center justify-between mb-1.5">
                                        <span :class="day.isToday ? 'bg-brand-600 text-white font-bold rounded-full w-6 h-6 flex items-center justify-center text-xs shadow-md ring-2 ring-brand-300' : 'text-xs font-semibold text-slate-600 dark:text-slate-300'" x-text="day.dayNumber"></span>
                                        <span x-show="day.tasks && day.tasks.length" class="text-[10px] font-bold px-1.5 py-0.2 bg-slate-100 dark:bg-slate-700 rounded-full text-slate-500" x-text="day.tasks.length + ' тикет'"></span>
                                    </div>

                                    <!-- Tasks due on this day -->
                                    <div class="space-y-1.5 overflow-y-auto max-h-[95px] custom-scrollbar pr-0.5">
                                        <template x-for="task in day.tasks" :key="task.id">
                                            <div @click.stop="openTaskDetail(task.id)" 
                                                :class="task.task_type === 'bug' ? 'bg-red-50 hover:bg-red-100 dark:bg-red-950/60 dark:hover:bg-red-900/80 border-red-300 dark:border-red-800 text-red-900 dark:text-red-200' : 'bg-blue-50 hover:bg-blue-100 dark:bg-blue-950/60 dark:hover:bg-blue-900/80 border-blue-300 dark:border-blue-800 text-blue-900 dark:text-blue-200'"
                                                class="p-1.5 rounded-xl border text-[11px] font-semibold cursor-pointer shadow-2xs hover:shadow-md transition-all duration-150 transform hover:-translate-y-0.5 flex items-center justify-between group" 
                                                :title="task.title + ' (Статус: ' + getStatusLabel(task.status) + ')'">
                                                <div class="flex items-center space-x-1.5 truncate">
                                                    <span class="w-2 h-2 rounded-full shrink-0" :class="task.task_type === 'bug' ? 'bg-red-500' : getPriorityColor(task.priority)"></span>
                                                    <span x-show="task.task_type === 'bug'" class="text-[10px] shrink-0">🐞</span>
                                                    <span class="truncate font-medium" x-text="task.title"></span>
                                                </div>

                                                <!-- Assignee Avatar Dot -->
                                                <template x-if="task.assignee">
                                                    <div class="w-4 h-4 rounded-full text-white font-bold text-[8px] flex items-center justify-center shrink-0 shadow-xs" :style="{ backgroundColor: task.assignee.avatar_color }" :title="'Исполнитель: ' + task.assignee.full_name">
                                                        <span x-text="getInitials(task.assignee.full_name)"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

            </main>

            <!-- ---------------- MODAL: TASK / BUG DETAILS ---------------- -->
            <div x-show="showDetailModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">
                <div @click.away="showDetailModal = false" class="bg-white dark:bg-slate-800 w-full max-w-6xl rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col h-[90vh] max-h-[850px]">
                    
                    <!-- Header -->
                    <div class="px-6 py-3.5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between bg-slate-50 dark:bg-slate-800/80 shrink-0">
                        <div class="flex items-center space-x-3">
                            <span class="font-mono text-xs text-slate-400" x-text="'#' + activeTask.id"></span>
                            <span x-show="activeTask.task_type === 'bug'" class="px-2 py-0.5 rounded text-xs font-bold bg-red-600 text-white">БАГ</span>
                            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold" :class="getStatusBadgeClass(activeTask.status)" x-text="getStatusLabel(activeTask.status)"></span>
                        </div>

                        <div class="flex items-center space-x-2">
                            <button x-show="activeTask.status !== 'done'" @click="completeActiveTask()" class="px-3.5 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow transition flex items-center space-x-1.5">
                                <i data-lucide="check-circle" class="w-4 h-4"></i>
                                <span x-text="activeTask.task_type === 'bug' ? 'Исправлен / Завершить' : 'Завершить задачу'"></span>
                            </button>
                            <button x-show="activeTask.status === 'done' || activeTask.status === 'in_review'" @click="openReopenModal()" class="px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow transition flex items-center space-x-1.5" title="Вернуть задачу в работу с комментарием">
                                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
                                <span>Вернуть в работу</span>
                            </button>
                            <span x-show="activeTask.status === 'done'" class="px-3 py-1 bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 rounded-xl text-xs font-bold flex items-center space-x-1 border border-emerald-200">
                                <i data-lucide="check-check" class="w-4 h-4 text-emerald-600"></i>
                                <span>Завершено</span>
                            </span>
                            <button @click="deleteTask(activeTask.id)" class="p-2 text-red-500 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg transition" title="Удалить">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                            <button @click="showDetailModal = false" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 rounded-lg">
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Side-by-Side 2 Columns Body Container -->
                    <div class="flex-1 grid grid-cols-1 lg:grid-cols-12 overflow-hidden">
                        
                        <!-- LEFT COLUMN (7 of 12 cols, ~60%): Task Details Body -->
                        <div class="lg:col-span-7 p-6 overflow-y-auto custom-scrollbar space-y-6 border-b lg:border-b-0 lg:border-r border-slate-200 dark:border-slate-700">
                            <!-- Task Title Field -->
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Заголовок</label>
                                <input type="text" x-model="activeTask.title" @change="updateActiveTaskField('title', activeTask.title)" class="w-full text-xl font-bold bg-transparent border-b border-slate-200 dark:border-slate-700 focus:border-brand-500 pb-1 outline-none text-slate-900 dark:text-white">
                            </div>

                            <!-- Task Roles Box: Постановщик, Исполнитель, Наблюдатели -->
                            <div class="bg-slate-50 dark:bg-slate-700/40 p-4 rounded-xl space-y-3 border border-slate-200 dark:border-slate-700">
                                <h4 class="text-xs font-bold uppercase text-slate-400 flex items-center space-x-1.5">
                                    <i data-lucide="users" class="w-4 h-4 text-brand-600"></i>
                                    <span>Участники и роли по задаче</span>
                                </h4>

                                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                                    <!-- Role 1: Постановщик -->
                                    <div class="bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                                        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center space-x-1">
                                            <span>👑 Постановщик (Автор)</span>
                                        </div>
                                        <template x-if="activeTask.creator">
                                            <div @click.stop="openUserProfile(activeTask.creator.id)" class="flex items-center space-x-2 mt-1 cursor-pointer hover:opacity-80 transition" title="Открыть профиль пользователя">
                                                <div class="w-6 h-6 rounded-full text-white font-bold text-[10px] flex items-center justify-center shrink-0" :style="{ backgroundColor: activeTask.creator.avatar_color }">
                                                    <span x-text="getInitials(activeTask.creator.full_name)"></span>
                                                </div>
                                                <div class="truncate">
                                                    <div class="font-semibold text-slate-800 dark:text-slate-100 truncate text-xs hover:text-brand-600 transition" x-text="activeTask.creator.full_name"></div>
                                                    <div class="text-[10px] text-slate-400 truncate" x-text="activeTask.creator.role || 'Автор'"></div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>

                                    <!-- Role 2: Исполнитель -->
                                    <div class="bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                                        <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider mb-1 flex items-center space-x-1">
                                            <span>🛠️ Исполнитель</span>
                                        </div>
                                        <select x-model="activeTask.assignee_id" @change="updateActiveTaskField('assignee_id', activeTask.assignee_id)" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded text-xs py-1 px-1.5 outline-none font-semibold mt-1">
                                            <option :value="null">Не назначен</option>
                                            <template x-for="u in usersList" :key="u.id">
                                                <option :value="u.id" x-text="u.full_name"></option>
                                            </template>
                                        </select>
                                    </div>

                                    <!-- Role 3: Наблюдатели -->
                                    <div class="bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-200 dark:border-slate-700">
                                        <div class="flex items-center justify-between mb-1">
                                            <div class="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">
                                                <span>👁️ Наблюдатели (<span x-text="activeTask.watchers ? activeTask.watchers.length : 0"></span>)</span>
                                            </div>
                                            <button @click="toggleMyWatcher(activeTask.id)" :class="isWatching(activeTask) ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'" class="px-2 py-0.5 rounded text-[10px] font-semibold transition flex items-center space-x-1">
                                                <i data-lucide="eye" class="w-3 h-3"></i>
                                                <span x-text="isWatching(activeTask) ? 'Вы наблюдаете' : 'Буду наблюдать'"></span>
                                            </button>
                                        </div>
                                        <div class="flex flex-wrap gap-1 mt-1">
                                            <template x-for="w in activeTask.watchers" :key="w.id">
                                                <div @click.stop="openUserProfile(w.id)" class="flex items-center space-x-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 px-1.5 py-0.5 rounded text-[10px] cursor-pointer transition" :title="w.full_name + ' (' + w.role + ')'">
                                                    <span class="w-2 h-2 rounded-full shrink-0" :style="{ backgroundColor: w.avatar_color }"></span>
                                                    <span class="truncate max-w-[80px]" x-text="w.full_name.split(' ')[0]"></span>
                                                </div>
                                            </template>
                                            <span x-show="!activeTask.watchers || !activeTask.watchers.length" class="text-[11px] text-slate-400 italic">Нет наблюдателей</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Grid Fields: Status, Priority / Severity, Due Date -->
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 dark:bg-slate-700/40 p-4 rounded-xl">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Статус</label>
                                    <select x-model="activeTask.status" @change="updateActiveTaskField('status', activeTask.status)" class="w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs py-1.5 px-2 outline-none">
                                        <option value="todo">В работе</option>
                                        <option value="in_progress">В работе</option>
                                        <option value="in_review">На проверке</option>
                                        <option value="done">Завершена</option>
                                    </select>
                                </div>

                                <div x-show="activeTask.task_type !== 'bug'">
                                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Приоритет</label>
                                    <select x-model="activeTask.priority" @change="updateActiveTaskField('priority', activeTask.priority)" class="w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs py-1.5 px-2 outline-none">
                                        <option value="low">Низкий</option>
                                        <option value="medium">Средний</option>
                                        <option value="high">Высокий</option>
                                        <option value="urgent">Срочный</option>
                                    </select>
                                </div>

                                <div x-show="activeTask.task_type === 'bug'">
                                    <label class="block text-xs font-semibold text-red-500 mb-1">Критичность бага</label>
                                    <select x-model="activeTask.severity" @change="updateActiveTaskField('severity', activeTask.severity)" class="w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs py-1.5 px-2 outline-none font-semibold">
                                        <option value="critical">Critical (Блокер)</option>
                                        <option value="major">Major (Высокий приоритет)</option>
                                        <option value="minor">Minor (Средний приоритет)</option>
                                        <option value="trivial">Trivial (Минорная)</option>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Срок сдачи</label>
                                    <input type="date" x-model="activeTask.due_date" @change="updateActiveTaskField('due_date', activeTask.due_date)" class="w-full bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-xs py-1.5 px-2 outline-none">
                                </div>
                            </div>

                            <!-- Description Field -->
                            <div>
                                <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Описание задачи</label>
                                <textarea x-model="activeTask.description" @change="updateActiveTaskField('description', activeTask.description)" rows="3" class="w-full p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl border border-slate-200 dark:border-slate-700 text-sm focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Добавьте описание..."></textarea>
                            </div>

                            <!-- Steps to Reproduce (if Bug) -->
                            <div x-show="activeTask.task_type === 'bug'">
                                <label class="block text-xs font-bold uppercase text-red-500 mb-1">Шаги для воспроизведения бага</label>
                                <textarea x-model="activeTask.steps_to_reproduce" @change="updateActiveTaskField('steps_to_reproduce', activeTask.steps_to_reproduce)" rows="3" class="w-full p-3 bg-red-50/50 dark:bg-red-950/20 rounded-xl border border-red-200 dark:border-red-900 text-sm font-mono focus:ring-2 focus:ring-red-500 outline-none" placeholder="1. Открыть страницу...&#10;2. Нажать на..."></textarea>
                            </div>

                            <!-- Attachments Section Dropzone -->
                            <div class="bg-gradient-to-br from-blue-500/10 via-indigo-500/10 to-brand-500/10 dark:from-blue-900/40 dark:via-indigo-900/30 dark:to-slate-800 border-2 border-dashed border-brand-500 dark:border-brand-400 rounded-2xl p-4 shadow-sm">
                                <div class="flex items-center justify-between mb-3">
                                    <div class="flex items-center space-x-2.5">
                                        <span class="p-2 bg-brand-600 text-white rounded-xl shadow-xs">
                                            <i data-lucide="paperclip" class="w-4 h-4"></i>
                                        </span>
                                        <div>
                                            <label class="block text-xs font-bold uppercase text-brand-700 dark:text-blue-300">Вложения задачи</label>
                                            <span class="text-[11px] text-slate-500 dark:text-slate-400">Документы и материалы</span>
                                        </div>
                                    </div>
                                    <label class="cursor-pointer text-xs bg-brand-600 hover:bg-brand-700 text-white px-3.5 py-1.5 rounded-xl font-bold shadow-md transition flex items-center space-x-1.5">
                                        <i data-lucide="upload-cloud" class="w-4 h-4"></i>
                                        <span x-text="uploadingFile ? 'Загрузка...' : 'Загрузить'"></span>
                                        <input type="file" multiple class="hidden" @change="uploadAttachment($event)" :disabled="uploadingFile">
                                    </label>
                                </div>

                                <!-- Uploaded Files List Grid -->
                                <div class="grid grid-cols-1 gap-2.5 mt-2" x-show="activeTask.attachments && activeTask.attachments.length">
                                    <template x-for="att in activeTask.attachments" :key="att.id">
                                        <div class="flex items-center justify-between p-2.5 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-2xs text-xs">
                                            <div class="flex items-center space-x-2.5 truncate">
                                                <div class="p-1.5 bg-blue-100 dark:bg-blue-900/60 text-brand-600 dark:text-blue-300 rounded-lg shrink-0">
                                                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                                                </div>
                                                <div class="truncate">
                                                    <a :href="att.file_path" target="_blank" class="font-semibold text-slate-800 dark:text-slate-200 hover:underline truncate block" x-text="att.filename"></a>
                                                    <span class="text-slate-400 text-[10px]" x-text="formatFileSize(att.file_size)"></span>
                                                </div>
                                            </div>

                                            <div class="flex items-center space-x-1 shrink-0 ml-2">
                                                <a :href="att.file_path" download target="_blank" class="p-1 text-slate-400 hover:text-brand-600 rounded">
                                                    <i data-lucide="download" class="w-3.5 h-3.5"></i>
                                                </a>
                                                <button @click="deleteAttachment(att.id)" class="p-1 text-slate-400 hover:text-red-600 rounded">
                                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </div>

                                <div x-show="!activeTask.attachments || activeTask.attachments.length === 0" class="text-center py-2 text-xs text-slate-500 dark:text-slate-400 font-medium">
                                    Вложения пока отсутствуют.
                                </div>
                            </div>
                        </div>

                        <!-- RIGHT COLUMN (5 of 12 cols, ~40%): Dedicated Task Discussion Chat -->
                        <div class="lg:col-span-5 bg-slate-50/80 dark:bg-slate-900/60 p-4 flex flex-col h-full overflow-hidden border-t lg:border-t-0">
                            <!-- Chat Header Toolbar -->
                            <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700/80 shrink-0">
                                <div class="flex items-center space-x-2">
                                    <span class="p-1.5 bg-brand-600 text-white rounded-lg shadow-xs">
                                        <i data-lucide="messages-square" class="w-4 h-4"></i>
                                    </span>
                                    <div>
                                        <h3 class="font-bold text-xs uppercase tracking-wider text-slate-800 dark:text-white">Чат задачи</h3>
                                        <p class="text-[10px] text-slate-400">История сохранется</p>
                                    </div>
                                </div>

                                <!-- Employee Invite Dropdown -->
                                <select @change="inviteUserToChat($event.target.value); $event.target.value = ''" class="bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 text-[11px] rounded-lg py-1 px-2 font-bold outline-none cursor-pointer hover:bg-indigo-100 transition max-w-[140px] truncate">
                                    <option value="">+ Пригласить...</option>
                                    <template x-for="u in usersList" :key="u.id">
                                        <option :value="u.id" x-text="u.full_name"></option>
                                    </template>
                                </select>
                            </div>

                            <!-- Chat Messages Timeline -->
                            <div class="flex-1 overflow-y-auto custom-scrollbar space-y-2.5 my-2 pr-1">
                                <template x-for="comm in activeComments" :key="comm.id">
                                    <div class="flex items-start space-x-2.5 p-2.5 rounded-xl text-xs transition" 
                                        :class="comm.content.startsWith('📢') ? 'bg-indigo-50/90 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800' : (comm.content.startsWith('⏪') ? 'bg-amber-50/90 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800' : (comm.content.startsWith('📎') ? 'bg-blue-50/90 dark:bg-blue-950/60 border border-blue-200 dark:border-blue-800' : 'bg-white dark:bg-slate-800 shadow-2xs border border-slate-200/80 dark:border-slate-700'))">
                                        <div @click.stop="openUserProfile(comm.author ? comm.author.id : null)" class="w-7 h-7 rounded-full text-white font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5 shadow-2xs cursor-pointer hover:opacity-80 transition" :style="{ backgroundColor: comm.author ? comm.author.avatar_color : '#3b82f6' }" title="Открыть профиль">
                                            <span x-text="getInitials(comm.author ? comm.author.full_name : 'U')"></span>
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center justify-between text-[11px] mb-0.5">
                                                <span @click.stop="openUserProfile(comm.author ? comm.author.id : null)" class="font-bold text-slate-800 dark:text-slate-100 truncate cursor-pointer hover:text-brand-600 transition" x-text="comm.author ? comm.author.full_name : 'Пользователь'"></span>
                                                <span class="text-slate-400 text-[9px] shrink-0" x-text="formatDate(comm.created_at)"></span>
                                            </div>
                                            <p class="text-xs text-slate-800 dark:text-slate-200 leading-snug break-words whitespace-pre-line font-sans" x-text="comm.content"></p>
                                        </div>
                                    </div>
                                </template>

                                <template x-if="!activeComments || activeComments.length === 0">
                                    <div class="py-12 text-center text-xs text-slate-400 dark:text-slate-500">
                                        <i data-lucide="messages-square" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                                        <p>Обсуждение еще не начато.</p>
                                        <p class="text-[10px] mt-1">Отправьте сообщение или прикрепите файл!</p>
                                    </div>
                                </template>
                            </div>

                            <!-- Chat Actions & Input Form -->
                            <div class="pt-2 border-t border-slate-200 dark:border-slate-700/80 shrink-0 space-y-2">
                                <!-- Mentions chips bar -->
                                <div class="flex items-center space-x-1 text-[10px] overflow-x-auto custom-scrollbar pb-1">
                                    <span class="text-slate-400 font-bold shrink-0">Упомянуть:</span>
                                    <template x-for="u in usersList" :key="u.id">
                                        <button type="button" @click="insertMention(u.username)" class="px-1.5 py-0.5 bg-slate-200/70 hover:bg-brand-100 dark:bg-slate-700 text-brand-700 dark:text-blue-300 rounded font-mono text-[10px] shrink-0 font-semibold transition">
                                            <span x-text="'@' + u.username"></span>
                                        </button>
                                    </template>
                                </div>

                                <!-- Hidden File Input for Chat Attachments -->
                                <input type="file" multiple x-ref="chatFileInput" @change="uploadChatAttachment($event)" class="hidden">

                                <!-- Input Form with paperclip file attach button -->
                                <form @submit.prevent="submitComment()" class="flex items-center gap-1.5">
                                    <button type="button" @click="$refs.chatFileInput.click()" class="p-2 text-slate-500 hover:text-brand-600 dark:text-slate-400 dark:hover:text-blue-400 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shrink-0 transition" title="Прикрепить файлы в чат">
                                        <i data-lucide="paperclip" class="w-4 h-4"></i>
                                    </button>
                                    <input type="text" x-model="newCommentText" placeholder="Написать сообщение..." required class="flex-1 px-3 py-2 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500 shadow-2xs">
                                    <button type="submit" class="px-3.5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-xs transition flex items-center space-x-1 shrink-0">
                                        <i data-lucide="send" class="w-3.5 h-3.5"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ---------------- MODAL: CREATE TASK / BUG ---------------- -->
            <div x-show="showCreateModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div @click.away="showCreateModal = false" class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6">
                    <div class="flex items-center justify-between mb-4 border-b border-slate-100 dark:border-slate-700 pb-3">
                        <h3 class="text-lg font-bold" x-text="createTaskForm.task_type === 'bug' ? 'Зафиксировать баг' : 'Создать новую задачу'"></h3>
                        <button @click="showCreateModal = false" class="p-1 text-slate-400 hover:text-slate-600">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <form @submit.prevent="createTask()">
                        <div class="space-y-4">
                            <!-- Type Switcher -->
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Тип тикета</label>
                                <div class="grid grid-cols-2 gap-2">
                                    <button type="button" @click="createTaskForm.task_type = 'task'" :class="createTaskForm.task_type === 'task' ? 'bg-brand-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'" class="py-2 rounded-lg text-xs transition flex items-center justify-center space-x-1.5">
                                        <i data-lucide="check-square" class="w-4 h-4"></i>
                                        <span>Обычная задача</span>
                                    </button>
                                    <button type="button" @click="createTaskForm.task_type = 'bug'" :class="createTaskForm.task_type === 'bug' ? 'bg-red-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'" class="py-2 rounded-lg text-xs transition flex items-center justify-center space-x-1.5">
                                        <i data-lucide="bug" class="w-4 h-4"></i>
                                        <span>Отчёт об ошибке (Баг)</span>
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Название *</label>
                                <input type="text" x-model="createTaskForm.title" required :placeholder="createTaskForm.task_type === 'bug' ? 'Ошибка при сохранении профиля...' : 'Например: Обновить верстку шапки'" class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500">
                            </div>

                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Описание</label>
                                <textarea x-model="createTaskForm.description" rows="2" placeholder="Подробная информация..." class="w-full px-3.5 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                            </div>

                            <!-- Bug Steps to reproduce -->
                            <div x-show="createTaskForm.task_type === 'bug'">
                                <label class="block text-xs font-semibold uppercase text-red-500 mb-1">Шаги для воспроизведения</label>
                                <textarea x-model="createTaskForm.steps_to_reproduce" rows="3" placeholder="1. Открыть браузер&#10;2. Нажать Войти" class="w-full px-3.5 py-2 bg-red-50/40 dark:bg-red-950/20 border border-red-200 dark:border-red-900 rounded-lg text-sm outline-none font-mono focus:ring-2 focus:ring-red-500"></textarea>
                            </div>

                            <!-- Attach File during Creation (Prominent Right Below Description) -->
                            <div class="bg-gradient-to-r from-blue-500/10 via-indigo-500/10 to-brand-500/10 dark:from-blue-900/30 dark:to-slate-700/60 p-4 rounded-2xl border-2 border-dashed border-brand-500 dark:border-brand-400">
                                <div class="flex items-center space-x-2 mb-1.5">
                                    <span class="p-1.5 bg-brand-600 text-white rounded-lg shadow-xs">
                                        <i data-lucide="paperclip" class="w-4 h-4"></i>
                                    </span>
                                    <div>
                                        <label class="block text-xs font-bold uppercase text-brand-700 dark:text-blue-300">Прикрепить файлы и скриншоты</label>
                                        <span class="text-[11px] text-slate-500 dark:text-slate-400">Прикрепите скриншоты ошибки или ТЗ</span>
                                    </div>
                                </div>
                                <input type="file" multiple @change="handleCreateFileSelect($event)" class="w-full text-xs text-slate-600 dark:text-slate-300 file:mr-3 file:py-1.5 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-brand-600 file:text-white hover:file:bg-brand-700 cursor-pointer">
                                <template x-if="createTaskPendingFiles && createTaskPendingFiles.length">
                                    <p class="text-[11px] text-emerald-600 dark:text-emerald-400 font-bold mt-2 flex items-center space-x-1">
                                        <i data-lucide="check-circle" class="w-4 h-4"></i>
                                        <span>Выбрано файлов: <strong x-text="createTaskPendingFiles.length"></strong></span>
                                    </p>
                                </template>
                            </div>

                            <!-- Roles Assignment during Creation -->
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">🛠️ Исполнитель</label>
                                    <select x-model="createTaskForm.assignee_id" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none">
                                        <option :value="null">Не назначен</option>
                                        <template x-for="u in usersList" :key="u.id">
                                            <option :value="u.id" x-text="u.full_name"></option>
                                        </template>
                                    </select>
                                </div>

                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Срок исправления</label>
                                    <input type="date" x-model="createTaskForm.due_date" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none">
                                </div>
                            </div>

                            <!-- Watchers Selection -->
                            <div>
                                <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">👁️ Наблюдатели (будут следить за тикетом)</label>
                                <div class="flex flex-wrap gap-2 bg-slate-50 dark:bg-slate-700/50 p-2.5 rounded-lg border border-slate-200 dark:border-slate-600">
                                    <template x-for="u in usersList" :key="u.id">
                                        <label class="flex items-center space-x-1.5 bg-white dark:bg-slate-700 px-2 py-1 rounded border border-slate-200 dark:border-slate-600 text-xs cursor-pointer">
                                            <input type="checkbox" :value="u.id" x-model="createTaskForm.watcher_ids" class="rounded text-brand-600 focus:ring-0">
                                            <span x-text="u.full_name"></span>
                                        </label>
                                    </template>
                                </div>
                            </div>

                            <!-- Priority & Status -->
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Статус</label>
                                    <select x-model="createTaskForm.status" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none">
                                        <option value="todo">В работе</option>
                                        <option value="in_progress">В работе</option>
                                        <option value="in_review">На проверке</option>
                                        <option value="done">Завершена</option>
                                    </select>
                                </div>
                                <div x-show="createTaskForm.task_type !== 'bug'">
                                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Приоритет</label>
                                    <select x-model="createTaskForm.priority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none">
                                        <option value="low">Низкий</option>
                                        <option value="medium">Средний</option>
                                        <option value="high">Высокий</option>
                                        <option value="urgent">Срочный</option>
                                    </select>
                                </div>
                                <div x-show="createTaskForm.task_type === 'bug'">
                                    <label class="block text-xs font-semibold uppercase text-red-500 mb-1">Критичность</label>
                                    <select x-model="createTaskForm.severity" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-lg text-sm outline-none font-semibold">
                                        <option value="critical">Critical (Блокер)</option>
                                        <option value="major">Major (Высокий приоритет)</option>
                                        <option value="minor">Minor (Средний приоритет)</option>
                                        <option value="trivial">Trivial (Минорная)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="pt-4 flex justify-end space-x-3">
                                <button type="button" @click="showCreateModal = false" :disabled="submittingTask" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg transition">Отмена</button>
                                <button type="submit" :disabled="submittingTask" :class="[createTaskForm.task_type === 'bug' ? 'bg-red-600 hover:bg-red-700' : 'bg-brand-600 hover:bg-brand-700', submittingTask ? 'opacity-50 cursor-not-allowed' : '']" class="px-5 py-2 text-white text-sm font-medium rounded-lg shadow transition flex items-center space-x-2">
                                    <template x-if="submittingTask">
                                        <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                        </svg>
                                    </template>
                                    <span x-text="submittingTask ? 'Создание...' : (createTaskForm.task_type === 'bug' ? 'Зафиксировать баг' : 'Создать задачу')"></span>
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- ---------------- MODAL: REOPEN TASK WITH COMMENT ---------------- -->
            <div x-show="showReopenModal" class="fixed inset-0 z-50 overflow-y-auto bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div @click.away="showReopenModal = false" class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 p-6 space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                        <h3 class="font-bold text-base text-slate-900 dark:text-white flex items-center space-x-2">
                            <i data-lucide="rotate-ccw" class="w-5 h-5 text-amber-500"></i>
                            <span>Возврат задачи в работу</span>
                        </h3>
                        <button @click="showReopenModal = false" class="text-slate-400 hover:text-slate-600">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <p class="text-xs text-slate-500 dark:text-slate-400">Укажите причину или замечания, почему задачу необходимо вернуть в статус «В работе»:</p>

                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-400 mb-1">Комментарий к возврату *</label>
                        <textarea x-model="reopenReason" rows="3" placeholder="Например: Не все требования выполнены, необходимо доработать интерфейс..." class="w-full p-3 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-sm outline-none focus:ring-2 focus:ring-amber-500 text-slate-900 dark:text-white"></textarea>
                    </div>

                    <div class="flex justify-end space-x-3 pt-2">
                        <button type="button" @click="showReopenModal = false" class="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700 rounded-xl transition">Отмена</button>
                        <button type="button" @click="confirmReopenTask()" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow transition flex items-center space-x-1.5">
                            <i data-lucide="corner-up-left" class="w-4 h-4"></i>
                            <span>Вернуть в работу</span>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </template>

    <!-- ---------------- USER PROFILE MODAL ---------------- -->
    <div x-show="showUserProfileModal && selectedUserProfile" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs custom-scrollbar overflow-y-auto" @click.self="showUserProfileModal = false">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-700 w-full max-w-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            <!-- Header Banner -->
            <div class="h-28 bg-gradient-to-r from-brand-600 via-indigo-600 to-purple-600 relative p-6">
                <button @click="showUserProfileModal = false" class="absolute top-4 right-4 p-2 bg-white/20 hover:bg-white/30 text-white rounded-full transition backdrop-blur-xs">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Avatar & Core Info -->
            <div class="px-6 pb-6 relative">
                <div class="flex flex-col sm:flex-row sm:items-end justify-between -mt-12 mb-6 gap-4">
                    <div class="flex items-end space-x-4">
                        <div class="relative">
                            <template x-if="selectedUserProfile && selectedUserProfile.avatar_url">
                                <img :src="selectedUserProfile.avatar_url" class="w-24 h-24 rounded-3xl object-cover shadow-xl border-4 border-white dark:border-slate-800 shrink-0">
                            </template>
                            <template x-if="selectedUserProfile && !selectedUserProfile.avatar_url">
                                <div class="w-24 h-24 rounded-3xl text-white font-extrabold text-3xl flex items-center justify-center shadow-xl border-4 border-white dark:border-slate-800 shrink-0" :style="{ backgroundColor: selectedUserProfile ? selectedUserProfile.avatar_color : '#3b82f6' }">
                                    <span x-text="getInitials(selectedUserProfile ? selectedUserProfile.full_name : '')"></span>
                                </div>
                            </template>
                            <span class="absolute bottom-1 right-1 w-4 h-4 rounded-full border-2 border-white dark:border-slate-800" :class="selectedUserProfile && selectedUserProfile.is_online ? 'bg-emerald-500' : 'bg-slate-400'"></span>
                        </div>
                        <div class="mb-1">
                            <h2 class="text-2xl font-bold text-slate-900 dark:text-white" x-text="selectedUserProfile ? selectedUserProfile.full_name : ''"></h2>
                            <div class="flex items-center space-x-2 text-sm text-slate-500 dark:text-slate-400">
                                <span x-text="'@' + (selectedUserProfile ? selectedUserProfile.username : '')"></span>
                                <span>•</span>
                                <span class="font-semibold text-brand-600 dark:text-blue-400" x-text="selectedUserProfile ? (selectedUserProfile.role || 'Разработчик') : ''"></span>
                            </div>
                        </div>
                    </div>

                    <div class="shrink-0 flex items-center space-x-2">
                        <button type="button" x-show="selectedUserProfile && (selectedUserProfile.id === currentUser.id || isAdmin)" @click.stop="showUserProfileModal = false; (selectedUserProfile.id === currentUser.id ? openEditProfileModal() : openAdminEditUserModal(selectedUserProfile.id))" class="px-3 py-1 bg-brand-50 hover:bg-brand-100 text-brand-700 dark:bg-brand-950 dark:text-blue-300 border border-brand-200 dark:border-brand-800 rounded-full text-xs font-bold transition flex items-center space-x-1">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5 pointer-events-none"></i>
                            <span class="pointer-events-none">Редактировать</span>
                        </button>
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold" :class="selectedUserProfile && selectedUserProfile.is_online ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400'">
                            <span class="w-2 h-2 rounded-full mr-1.5" :class="selectedUserProfile && selectedUserProfile.is_online ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'"></span>
                            <span x-text="selectedUserProfile && selectedUserProfile.is_online ? 'В сети сейчас' : (selectedUserProfile && selectedUserProfile.last_login ? 'Заходил: ' + formatDate(selectedUserProfile.last_login) : 'Не в сети')"></span>
                        </span>
                    </div>
                </div>

                <!-- Role Description Card -->
                <div class="mb-6">
                    <div class="bg-slate-50/80 dark:bg-slate-700/40 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-700/80 space-y-1">
                        <div class="flex items-center space-x-1.5 text-xs font-bold text-slate-700 dark:text-slate-200">
                            <i data-lucide="briefcase" class="w-4 h-4 text-brand-600"></i>
                            <span>Описание роли и обязанности</span>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed" x-text="selectedUserProfile ? (selectedUserProfile.role_description || 'Описание пока не заполнено сотрудником.') : ''"></p>
                    </div>
                </div>

                <!-- User Stats KPI Grid -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
                    <div class="bg-slate-50 dark:bg-slate-700/50 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-700/60 text-center">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Назначено</span>
                        <span class="text-xl font-bold text-slate-800 dark:text-white" x-text="selectedUserStats.assigned"></span>
                    </div>
                    <div class="bg-emerald-50/60 dark:bg-emerald-950/40 p-3.5 rounded-2xl border border-emerald-100 dark:border-emerald-900/40 text-center">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 block mb-1">Выполнено</span>
                        <span class="text-xl font-bold text-emerald-700 dark:text-emerald-300" x-text="selectedUserStats.completed"></span>
                    </div>
                    <div class="bg-blue-50/60 dark:bg-blue-950/40 p-3.5 rounded-2xl border border-blue-100 dark:border-blue-900/40 text-center">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 dark:text-blue-400 block mb-1">Создано задач</span>
                        <span class="text-xl font-bold text-blue-700 dark:text-blue-300" x-text="selectedUserStats.created"></span>
                    </div>
                    <div class="bg-red-50/60 dark:bg-red-950/40 p-3.5 rounded-2xl border border-red-100 dark:border-red-900/40 text-center">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-red-600 dark:text-red-400 block mb-1">Багов в работе</span>
                        <span class="text-xl font-bold text-red-700 dark:text-red-300" x-text="selectedUserStats.bugs"></span>
                    </div>
                </div>

                <!-- Tasks Assigned To This User List -->
                <div class="space-y-3">
                    <h3 class="font-bold text-sm text-slate-800 dark:text-slate-200 flex items-center justify-between">
                        <span class="flex items-center space-x-2">
                            <i data-lucide="layers" class="w-4 h-4 text-brand-600"></i>
                            <span>Задачи и тикеты пользователя</span>
                        </span>
                        <span class="text-xs text-slate-400" x-text="selectedUserTasks.length + ' всего'"></span>
                    </h3>

                    <div class="max-h-[240px] overflow-y-auto custom-scrollbar space-y-2 pr-1">
                        <template x-for="task in selectedUserTasks" :key="task.id">
                            <div @click="showUserProfileModal = false; openTaskDetail(task.id)" class="p-3 bg-slate-50/80 dark:bg-slate-700/40 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl border border-slate-100 dark:border-slate-700/80 cursor-pointer transition flex items-center justify-between gap-3">
                                <div class="flex items-center space-x-2.5 truncate">
                                    <span class="w-2 h-2 rounded-full shrink-0" :class="task.task_type === 'bug' ? 'bg-red-500' : getPriorityColor(task.priority)"></span>
                                    <span x-show="task.task_type === 'bug'" class="px-1.5 py-0.2 bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300 text-[9px] font-bold rounded shrink-0">БАГ</span>
                                    <span class="text-xs font-semibold text-slate-800 dark:text-slate-100 truncate hover:text-brand-600 transition" x-text="task.title"></span>
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-medium" :class="getStatusBadgeClass(task.status)" x-text="getStatusLabel(task.status)"></span>
                                    <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
                                </div>
                            </div>
                        </template>

                        <template x-if="selectedUserTasks.length === 0">
                            <div class="py-6 text-center text-xs text-slate-400">
                                У этого пользователя пока нет привязанных задач.
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ---------------- EDIT PROFILE MODAL ---------------- -->
    <div x-show="showEditProfileModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs custom-scrollbar overflow-y-auto" @click.self="showEditProfileModal = false">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-700 w-full max-w-xl p-6 animate-in fade-in zoom-in duration-200 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center space-x-2">
                    <i data-lucide="user-cog" class="w-5 h-5 text-brand-600"></i>
                    <span>Редактирование профиля</span>
                </h3>
                <button type="button" @click="showEditProfileModal = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form @submit.prevent="saveProfile()" class="space-y-4 text-xs">
                <!-- Photo Avatar Upload & Color Picker -->
                <div class="flex items-center space-x-4 bg-slate-50 dark:bg-slate-700/50 p-4 rounded-2xl border border-slate-200/60 dark:border-slate-700">
                    <div class="relative shrink-0">
                        <template x-if="currentUser.avatar_url">
                            <img :src="currentUser.avatar_url" class="w-16 h-16 rounded-2xl object-cover border-2 border-white shadow-md">
                        </template>
                        <template x-if="!currentUser.avatar_url">
                            <div class="w-16 h-16 rounded-2xl text-white font-extrabold text-xl flex items-center justify-center shadow-md" :style="{ backgroundColor: editProfileForm.avatar_color }">
                                <span x-text="getInitials(editProfileForm.full_name || currentUser.full_name)"></span>
                            </div>
                        </template>
                    </div>
                    <div class="flex-1 space-y-2">
                        <label class="block text-[11px] font-bold uppercase text-slate-500">Фотография аватара</label>
                        <label class="cursor-pointer inline-flex items-center space-x-1.5 px-3 py-1.5 bg-white dark:bg-slate-700 border border-slate-300 dark:border-slate-600 hover:bg-slate-50 rounded-xl font-semibold shadow-2xs transition">
                            <i data-lucide="camera" class="w-3.5 h-3.5 text-brand-600"></i>
                            <span>Загрузить фото...</span>
                            <input type="file" accept="image/*" class="hidden" @change="uploadUserAvatar($event)">
                        </label>

                        <!-- Color Palette -->
                        <div class="flex items-center space-x-1.5 pt-1">
                            <template x-for="c in ['#3b82f6', '#10b981', '#ec4899', '#8b5cf6', '#f59e0b', '#06b6d4', '#6366f1']" :key="c">
                                <button type="button" @click="editProfileForm.avatar_color = c" class="w-5 h-5 rounded-full border-2 transition" :class="editProfileForm.avatar_color === c ? 'border-slate-900 dark:border-white scale-110' : 'border-transparent'" :style="{ backgroundColor: c }"></button>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Full Name & Email -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Полное имя *</label>
                        <input type="text" x-model="editProfileForm.full_name" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Email</label>
                        <input type="email" x-model="editProfileForm.email" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <!-- Job Title / Role -->
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Должность / Название роли</label>
                    <input type="text" x-model="editProfileForm.role" placeholder="Например: Senior Frontend Developer" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                </div>

                <!-- Role Description / Responsibilities -->
                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Описание должности и обязанностей</label>
                    <textarea x-model="editProfileForm.role_description" rows="3" placeholder="Опишите стек технологий, ключевые зоны ответственности, стек проектов..." class="w-full p-3 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <!-- Submit Buttons -->
                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" @click="showEditProfileModal = false" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">Отмена</button>
                    <button type="submit" :disabled="savingProfile" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition flex items-center space-x-1.5">
                        <span x-text="savingProfile ? 'Сохранение...' : 'Сохранить изменения'"></span>
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ---------------- ADMIN ADD USER MODAL ---------------- -->
    <div x-show="showAdminAddUserModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs custom-scrollbar overflow-y-auto" @click.self="showAdminAddUserModal = false">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-700 w-full max-w-xl p-6 animate-in fade-in zoom-in duration-200 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center space-x-2">
                    <i data-lucide="user-plus" class="w-5 h-5 text-brand-600"></i>
                    <span>Добавление нового сотрудника</span>
                </h3>
                <button type="button" @click="showAdminAddUserModal = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form @submit.prevent="adminAddUser()" class="space-y-4 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">ФИО сотрудника *</label>
                        <input type="text" x-model="adminAddUserForm.full_name" required placeholder="Например: Иван Иванов" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Логин *</label>
                        <input type="text" x-model="adminAddUserForm.username" required placeholder="ivanov" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Пароль *</label>
                        <input type="password" x-model="adminAddUserForm.password" required placeholder="••••••••" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Email</label>
                        <input type="email" x-model="adminAddUserForm.email" placeholder="ivanov@company.ru" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Должность / Название роли *</label>
                    <input type="text" x-model="adminAddUserForm.role" list="roles-list-add" placeholder="Введите или выберите роль..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    <datalist id="roles-list-add">
                        <option value="Разработчик"></option>
                        <option value="Senior Frontend Developer"></option>
                        <option value="Lead Backend Developer"></option>
                        <option value="UI/UX Lead Designer"></option>
                        <option value="QA Lead / Тестировщик"></option>
                        <option value="DevOps & Security Engineer"></option>
                        <option value="Project Manager / CPO"></option>
                        <option value="Администратор"></option>
                    </datalist>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Описание обязанностей</label>
                    <textarea x-model="adminAddUserForm.role_description" rows="2" placeholder="Зоны ответственности, стек проектов..." class="w-full p-3 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" @click="showAdminAddUserModal = false" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 rounded-xl transition">Отмена</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition flex items-center space-x-1.5">
                        <span>Создать аккаунт</span>
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ---------------- ADMIN EDIT USER MODAL ---------------- -->
    <div x-show="showAdminEditUserModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs custom-scrollbar overflow-y-auto" @click.self="showAdminEditUserModal = false">
        <div class="bg-white dark:bg-slate-800 rounded-3xl shadow-2xl border border-slate-200/80 dark:border-slate-700 w-full max-w-xl p-6 animate-in fade-in zoom-in duration-200 space-y-5">
            <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                <h3 class="font-bold text-lg text-slate-800 dark:text-white flex items-center space-x-2">
                    <i data-lucide="user-check" class="w-5 h-5 text-brand-600"></i>
                    <span>Редактирование сотрудника (Администратор)</span>
                </h3>
                <button type="button" @click="showAdminEditUserModal = false" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form @submit.prevent="adminUpdateUser()" class="space-y-4 text-xs">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">ФИО сотрудника *</label>
                        <input type="text" x-model="adminEditUserForm.full_name" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Логин *</label>
                        <input type="text" x-model="adminEditUserForm.username" required class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Новый пароль (если хотите сбросить)</label>
                        <input type="password" x-model="adminEditUserForm.password" placeholder="Оставьте пустым, если не меняется" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Email</label>
                        <input type="email" x-model="adminEditUserForm.email" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Должность / Системная роль *</label>
                    <input type="text" x-model="adminEditUserForm.role" list="roles-list" placeholder="Введите или выберите роль..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500">
                    <datalist id="roles-list">
                        <option value="Разработчик"></option>
                        <option value="Senior Frontend Developer"></option>
                        <option value="Lead Backend Developer"></option>
                        <option value="UI/UX Lead Designer"></option>
                        <option value="QA Lead / Тестировщик"></option>
                        <option value="DevOps & Security Engineer"></option>
                        <option value="Project Manager / CPO"></option>
                        <option value="Администратор"></option>
                    </datalist>
                </div>

                <div>
                    <label class="block text-[11px] font-bold uppercase text-slate-500 mb-1">Описание обязанностей</label>
                    <textarea x-model="adminEditUserForm.role_description" rows="2" class="w-full p-3 bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 rounded-xl text-slate-900 dark:text-white outline-none focus:ring-2 focus:ring-brand-500"></textarea>
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" @click="showAdminEditUserModal = false" class="px-4 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 rounded-xl transition">Отмена</button>
                    <button type="submit" class="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl shadow-md transition flex items-center space-x-1.5">
                        <span>Сохранить изменения</span>
                        <i data-lucide="check" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js?v=38"></script>
</body>
</html>
