<!DOCTYPE html>
<html lang="ru" x-data="taskTrackerApp()" :class="{ 'dark': darkMode }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTracker — Системное управление задачами и багами</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        };
    </script>
    <!-- Application Logic -->
    <script src="js/app.js?v=38"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-200">

    <!-- ----------------- AUTH SCREEN ----------------- -->
    <template x-if="!isAuthenticated">
        <div class="min-h-screen flex flex-col justify-center items-center px-4 bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 dark:from-slate-900 dark:via-slate-800 dark:to-slate-950">
            <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 p-8">
                <!-- App Logo -->
                <div class="flex items-center justify-center space-x-3 mb-6">
                    <div class="bg-brand-600 text-white p-3 rounded-xl shadow-md">
                        <i data-lucide="check-square" class="w-7 h-7"></i>
                    </div>
                    <span class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400">
                        TaskTracker
                    </span>
                </div>

                <!-- Auth Tabs -->
                <div class="flex border-b border-slate-200 dark:border-slate-700 mb-6">
                    <button 
                        @click="authMode = 'login'" 
                        :class="{ 'border-brand-600 text-brand-600 dark:text-blue-400 font-semibold': authMode === 'login', 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400': authMode !== 'login' }"
                        class="flex-1 py-2 text-center border-b-2 transition-colors">
                        Вход
                    </button>
                    <button 
                        @click="authMode = 'register'" 
                        :class="{ 'border-brand-600 text-brand-600 dark:text-blue-400 font-semibold': authMode === 'register', 'border-transparent text-slate-500 hover:text-slate-700 dark:text-slate-400': authMode !== 'register' }"
                        class="flex-1 py-2 text-center border-b-2 transition-colors">
                        Регистрация
                    </button>
                </div>

                <!-- Error Alert -->
                <template x-if="authError">
                    <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-lg text-red-600 dark:text-red-400 text-sm flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                        <span x-text="authError"></span>
                    </div>
                </template>

                <!-- Login Form -->
                <form x-show="authMode === 'login'" @submit.prevent="login">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Логин</label>
                            <input type="text" x-model="loginForm.username" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition" placeholder="Введите логин">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Пароль</label>
                            <input type="password" x-model="loginForm.password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2">
                            <span>Войти</span>
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </button>
                    </div>
                </form>

                <!-- Register Form -->
                <form x-show="authMode === 'register'" @submit.prevent="register">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Логин</label>
                            <input type="text" x-model="registerForm.username" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition" placeholder="alex">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Полное имя</label>
                            <input type="text" x-model="registerForm.full_name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition" placeholder="Алексей Смирнов">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Email</label>
                            <input type="email" x-model="registerForm.email" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition" placeholder="alex@company.ru">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1">Пароль</label>
                            <input type="password" x-model="registerForm.password" required class="w-full px-4 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 text-slate-900 dark:text-white focus:ring-2 focus:ring-brand-500 focus:border-transparent outline-none transition" placeholder="••••••••">
                        </div>
                        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg shadow-md hover:shadow-lg transition-all flex items-center justify-center space-x-2">
                            <span>Зарегистрироваться</span>
                            <i data-lucide="user-plus" class="w-4 h-4"></i>
                        </button>
                    </div>
                </form>

                <!-- Quick Demo Login Buttons -->
                <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-700">
                    <p class="text-xs text-center text-slate-500 dark:text-slate-400 mb-3 uppercase tracking-wider font-semibold">Быстрый демо-вход</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button @click="quickLogin('admin', 'admin123')" class="px-3 py-2 text-xs bg-slate-100 dark:bg-slate-700 hover:bg-blue-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition text-left flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            <span class="truncate">admin (PM)</span>
                        </button>
                        <button @click="quickLogin('alex', 'alex123')" class="px-3 py-2 text-xs bg-slate-100 dark:bg-slate-700 hover:bg-green-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition text-left flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                            <span class="truncate">alex (Frontend)</span>
                        </button>
                        <button @click="quickLogin('maria', 'maria123')" class="px-3 py-2 text-xs bg-slate-100 dark:bg-slate-700 hover:bg-pink-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition text-left flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-pink-500"></span>
                            <span class="truncate">maria (UI/UX)</span>
                        </button>
                        <button @click="quickLogin('dmitry', 'dmitry123')" class="px-3 py-2 text-xs bg-slate-100 dark:bg-slate-700 hover:bg-purple-50 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 rounded-lg transition text-left flex items-center space-x-2">
                            <span class="w-2 h-2 rounded-full bg-purple-500"></span>
                            <span class="truncate">dmitry (Backend)</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ----------------- MAIN APP SCREEN ----------------- -->
    <template x-if="isAuthenticated">
        <div class="min-h-screen flex flex-col">
            <!-- Navigation Header -->
            <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
                <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                    
                    <!-- Left: Logo + Navigation Tabs -->
                    <div class="flex items-center space-x-6 lg:space-x-8">
                        <div class="flex items-center space-x-3 cursor-pointer" @click="activeTab = 'cabinet'">
                            <div class="bg-brand-600 text-white p-2 rounded-lg shadow-sm">
                                <i data-lucide="check-square" class="w-5 h-5"></i>
                            </div>
                            <span class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-brand-600 to-indigo-600 dark:from-blue-400 dark:to-indigo-400">
                                TaskTracker
                            </span>
                        </div>

                        <nav class="hidden md:flex space-x-1">
                            <button @click="activeTab = 'cabinet'" 
                                :class="activeTab === 'cabinet' ? 'bg-slate-100 text-brand-600 dark:bg-slate-700 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                                class="px-3 py-2 rounded-lg text-sm transition flex items-center space-x-2">
                                <i data-lucide="user" class="w-4 h-4"></i>
                                <span>Кабинет</span>
                            </button>
                            <button @click="activeTab = 'kanban'" 
                                :class="activeTab === 'kanban' ? 'bg-slate-100 text-brand-600 dark:bg-slate-700 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                                class="px-3 py-2 rounded-lg text-sm transition flex items-center space-x-2">
                                <i data-lucide="kanban" class="w-4 h-4"></i>
                                <span>Kanban Доска</span>
                            </button>
                            <button @click="activeTab = 'list'" 
                                :class="activeTab === 'list' ? 'bg-slate-100 text-brand-600 dark:bg-slate-700 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                                class="px-3 py-2 rounded-lg text-sm transition flex items-center space-x-2">
                                <i data-lucide="list-todo" class="w-4 h-4"></i>
                                <span>Все задачи</span>
                            </button>
                            <button @click="activeTab = 'bugs'" 
                                :class="activeTab === 'bugs' ? 'bg-red-50 text-red-600 dark:bg-red-950/50 dark:text-red-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                                class="px-3 py-2 rounded-lg text-sm transition flex items-center space-x-2 relative">
                                <i data-lucide="bug" class="w-4 h-4 text-red-500"></i>
                                <span>Баг трекер</span>
                                <span x-show="userStats.open_bugs_count" class="bg-red-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold" x-text="userStats.open_bugs_count"></span>
                            </button>
                            <button @click="activeTab = 'calendar'" 
                                :class="activeTab === 'calendar' ? 'bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                                class="px-3 py-2 rounded-lg text-sm transition flex items-center space-x-2">
                                <i data-lucide="calendar" class="w-4 h-4 text-amber-500"></i>
                                <span>Календарь</span>
                            </button>
                            <button @click="activeTab = 'analytics'; fetchFullStats()" 
                                :class="activeTab === 'analytics' ? 'bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 font-semibold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/50'"
                                class="px-3 py-2 rounded-lg text-sm transition flex items-center space-x-2">
                                <i data-lucide="bar-chart-3" class="w-4 h-4 text-indigo-500"></i>
                                <span>Аналитика</span>
                            </button>
                        </nav>
                    </div>

                    <!-- Right: Search, Create Buttons, User Dropdown -->
                    <div class="flex items-center space-x-2.5">
                        <!-- Search Box -->
                        <div class="relative hidden sm:block">
                            <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="text" x-model="searchQuery" @input.debounce.300ms="fetchTasks()" placeholder="Поиск..." class="pl-9 pr-4 py-1.5 text-xs bg-slate-100 dark:bg-slate-700 border-none rounded-lg focus:ring-2 focus:ring-brand-500 text-slate-800 dark:text-slate-100 outline-none w-32 lg:w-48">
                        </div>

                        <!-- Compact Report Bug Button -->
                        <button @click="openCreateBugModal()" class="px-2.5 py-1.5 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 rounded-lg text-xs font-semibold transition flex items-center space-x-1" title="Сообщить о баге">
                            <i data-lucide="bug" class="w-3.5 h-3.5 text-red-500"></i>
                            <span class="hidden sm:inline">Баг</span>
                        </button>

                        <!-- Create Task Button -->
                        <button @click="openCreateModal()" class="bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm hover:shadow transition flex items-center space-x-1">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                            <span>Задача</span>
                        </button>

                        <!-- Theme Toggle -->
                        <button @click="darkMode = !darkMode" class="p-1.5 text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
                            <i x-show="!darkMode" data-lucide="moon" class="w-4.5 h-4.5"></i>
                            <i x-show="darkMode" data-lucide="sun" class="w-4.5 h-4.5"></i>
                        </button>

                        <!-- Online Users Badge -->
                        <div class="flex items-center space-x-1.5 px-2.5 py-1 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-full text-xs font-semibold text-emerald-700 dark:text-emerald-300" title="Пользователи в сети">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                            <span x-text="onlineUsersCount + ' в сети'"></span>
                        </div>

                        <!-- User Profile Menu -->
                        <div class="relative">
                            <button type="button" @click.stop="userMenuOpen = !userMenuOpen" class="flex items-center space-x-2 focus:outline-none p-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">
                                <div class="relative shrink-0">
                                    <template x-if="currentUser.avatar_url">
                                        <img :src="currentUser.avatar_url" class="w-7 h-7 rounded-full object-cover border border-white shadow-xs">
                                    </template>
                                    <template x-if="!currentUser.avatar_url">
                                        <div class="w-7 h-7 rounded-full text-white font-semibold text-xs flex items-center justify-center shadow-xs" :style="{ backgroundColor: currentUser.avatar_color }">
                                            <span x-text="getInitials(currentUser.full_name)"></span>
                                        </div>
                                    </template>
                                </div>
                                <span class="text-xs font-medium hidden lg:inline" x-text="currentUser.full_name"></span>
                                <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-400 pointer-events-none"></i>
                            </button>

                            <!-- Dropdown -->
                            <div x-show="userMenuOpen" @click.away="userMenuOpen = false" class="absolute right-0 mt-2 w-48 bg-white dark:bg-slate-800 rounded-xl shadow-xl border border-slate-100 dark:border-slate-700 py-1 z-50">
                                <div class="px-4 py-2 border-b border-slate-100 dark:border-slate-700">
                                    <p class="text-sm font-semibold truncate" x-text="currentUser.full_name"></p>
                                    <p class="text-xs text-slate-500 dark:text-slate-400 truncate" x-text="'@' + currentUser.username"></p>
                                </div>
                                <button type="button" @click.stop="activeTab = 'cabinet'; openUserProfile(currentUser.id); userMenuOpen = false" class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center space-x-2">
                                    <i data-lucide="user" class="w-4 h-4 pointer-events-none"></i>
                                    <span class="pointer-events-none">Профиль</span>
                                </button>
                                <button type="button" @click.stop="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center space-x-2">
                                    <i data-lucide="log-out" class="w-4 h-4 pointer-events-none"></i>
                                    <span class="pointer-events-none">Выйти</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Mobile Nav Bar -->
                <div class="flex md:hidden border-t border-slate-200 dark:border-slate-700 px-2 py-1 justify-around">
                    <button @click="activeTab = 'cabinet'" :class="activeTab === 'cabinet' ? 'text-brand-600 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-400'" class="py-1.5 px-2 text-xs flex flex-col items-center">
                        <i data-lucide="user" class="w-4 h-4 mb-0.5"></i>
                        <span>Кабинет</span>
                    </button>
                    <button @click="activeTab = 'kanban'" :class="activeTab === 'kanban' ? 'text-brand-600 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-400'" class="py-1.5 px-2 text-xs flex flex-col items-center">
                        <i data-lucide="kanban" class="w-4 h-4 mb-0.5"></i>
                        <span>Kanban</span>
                    </button>
                    <button @click="activeTab = 'list'" :class="activeTab === 'list' ? 'text-brand-600 dark:text-blue-400 font-semibold' : 'text-slate-600 dark:text-slate-400'" class="py-1.5 px-2 text-xs flex flex-col items-center">
                        <i data-lucide="list-todo" class="w-4 h-4 mb-0.5"></i>
                        <span>Задачи</span>
                    </button>
                    <button @click="activeTab = 'bugs'" :class="activeTab === 'bugs' ? 'text-red-600 font-semibold' : 'text-slate-600 dark:text-slate-400'" class="py-1.5 px-2 text-xs flex flex-col items-center">
                        <i data-lucide="bug" class="w-4 h-4 mb-0.5 text-red-500"></i>
                        <span>Баги</span>
                    </button>
                    <button @click="activeTab = 'calendar'" :class="activeTab === 'calendar' ? 'text-amber-600 font-semibold' : 'text-slate-600 dark:text-slate-400'" class="py-1.5 px-2 text-xs flex flex-col items-center">
                        <i data-lucide="calendar" class="w-4 h-4 mb-0.5 text-amber-500"></i>
                        <span>Календарь</span>
                    </button>
                    <button @click="activeTab = 'analytics'; fetchFullStats()" :class="activeTab === 'analytics' ? 'text-indigo-600 font-semibold' : 'text-slate-600 dark:text-slate-400'" class="py-1.5 px-2 text-xs flex flex-col items-center">
                        <i data-lucide="bar-chart-3" class="w-4 h-4 mb-0.5 text-indigo-500"></i>
                        <span>Аналитика</span>
                    </button>
                </div>
            </header>

            <!-- Main Workspace Body -->
            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

                <!-- ---------------- TAB 1: PERSONAL CABINET ---------------- -->
                <div x-show="activeTab === 'cabinet'">
                    <!-- Profile Banner -->
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/80 dark:border-slate-700 mb-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                        <div class="flex items-center space-x-5">
                            <div class="w-16 h-16 rounded-2xl text-white font-bold text-2xl flex items-center justify-center shadow-md shrink-0" :style="{ backgroundColor: currentUser.avatar_color }">
                                <span x-text="getInitials(currentUser.full_name)"></span>
                            </div>
                            <div>
                                <h1 class="text-2xl font-bold" x-text="currentUser.full_name"></h1>
                                <div class="flex items-center space-x-3 mt-1 text-sm text-slate-500 dark:text-slate-400">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300" x-text="currentUser.role || 'Участник'"></span>
                                    <span>•</span>
                                    <span x-text="'@' + currentUser.username"></span>
                                    <span x-show="currentUser.email">•</span>
                                    <span x-show="currentUser.email" x-text="currentUser.email"></span>
                                </div>
                            </div>
                        </div>

                        <div class="flex items-center space-x-2.5 w-full md:w-auto">
